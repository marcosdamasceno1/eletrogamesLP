<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Eletrogames — mais de 28 anos vivendo o universo dos videogames">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F3F7FD"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#1560E0" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#1560E0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#1560E0" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#halo)"/>

  <rect x="80" y="88" width="72" height="72" rx="18" fill="#1560E0"/>
  <g transform="translate(100,108) scale(1.5)" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round">
    <path d="M12 3.5v7"/>
    <path d="M7.2 6.6a6.6 6.6 0 1 0 9.6 0"/>
  </g>
  <text x="176" y="127" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" fill="#072B4F">ELETRO<tspan fill="#1560E0">GAMES</tspan></text>

  <text x="80" y="300" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="60" font-weight="bold" fill="#072B4F">Mais de 28 anos vivendo</text>
  <text x="80" y="376" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="60" font-weight="bold" fill="#072B4F">o universo dos <tspan fill="#1560E0">videogames</tspan>.</text>

  <text x="80" y="452" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="26" fill="#54677F">Consoles • Controles • Periféricos • Acessórios</text>
  <text x="80" y="494" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="26" fill="#54677F">Assistência técnica especializada em videogames</text>

  <rect x="80" y="540" width="360" height="8" rx="4" fill="#1560E0"/>
</svg>
